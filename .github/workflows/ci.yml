name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job says otherwise. Nothing in CI writes to the repo, so
# a compromised step gets a token that can do nothing with it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the proxy spawns child processes and
        # that is where the platform differences bite — a .cmd shim needs a
        # shell, an interpreter path with a space must not have one.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22 resolves to the latest 22.x LTS, which is where `node:sqlite`
        # stopped needing --experimental-sqlite (22.13).
        node: ['22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/witness-record.test.mjs replays every commit
          # of witnesses/keys.json to prove it has only ever been appended to,
          # and a shallow clone has one commit to replay.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund

      - name: Repo hygiene
        run: node scripts/repo-hygiene.mjs

      - name: Test
        run: npm test
        env:
          PROOFWIRE_ACCESS_LOG: 'off'
          PROOFWIRE_INSECURE_COOKIES: '1'

      - name: Demo
        run: npm run demo

  core-compat:
    # @proof_wire/core claims Node >= 20.11 and has no dependencies, including
    # no node:sqlite. An engine range nothing exercises is a guess, so this
    # runs the core and proxy suites on the oldest version they claim.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.11', '20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - name: Core and proxy only
        run: node --test packages/core/test/*.test.js packages/proxy/test/*.test.js

  python-sdk:
    # The Python SDK against its own tests and, with Node present, against the
    # real CLI and core in both directions: a log Python wrote must pass
    # `pw verify` and `pw check`, and one JavaScript wrote must verify in
    # Python. 3.9 is the oldest version the package claims.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm install --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check ./sdk/python[test]
      - name: Tests, including interop with the CLI
        working-directory: sdk/python
        run: python -B -m pytest -q -p no:cacheprovider

  verify-own-log:
    # Proofwire's own repository keeps a Proofwire log. If the project cannot
    # keep its own evidence intact, nothing else here is worth believing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Verify the committed log, if there is one
        run: |
          if [ -d .proofwire ]; then
            node packages/cli/src/bin.js verify
          else
            echo "no committed log yet — skipping"
          fi

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Load profile
        run: node --no-warnings=ExperimentalWarning packages/server/bench/load.js

  docker:
    # A `docker build` that succeeds says nothing about whether the image
    # works — this builds it, boots a real container, and drives it the way a
    # client does: register a log, sign and push receipts, checkpoint, fetch
    # the bundle back, verify it, confirm a bogus token is refused. It caught
    # a receipt shape that crashed the hub with a raw SQLite error instead of
    # a clean 4xx (see receipt.js's requireField), which `npm test` alone —
    # never touching the container — could not have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # For @proof_wire/core in scripts/docker-smoke.mjs — the runner talks to
      # the container over HTTP; nothing from this install runs inside it.
      - run: npm install --no-audit --no-fund

      - name: Build the hub image
        run: docker build -t proofwire-hub .

      - name: Run it
        run: |
          docker run -d --name hub -p 8787:8787 proofwire-hub serve
          for i in $(seq 1 15); do
            status="$(docker inspect --format='{{.State.Health.Status}}' hub)"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && { echo "container went unhealthy"; docker logs hub; exit 1; }
            sleep 2
          done
          echo "never became healthy"; docker logs hub; exit 1

      - name: Bootstrap an org
        run: |
          # bootstrap prints to stderr (console.error throughout bin.js), not
          # stdout — 2>&1 is load-bearing, not decoration.
          docker exec \
            -e PROOFWIRE_ORG=CI -e PROOFWIRE_ORG_SLUG=ci \
            -e PROOFWIRE_ADMIN_EMAIL=ci@proofwire.test -e PROOFWIRE_ADMIN_PASSWORD=ci \
            hub node packages/server/src/bin.js bootstrap > bootstrap.out 2>&1
          echo "AGENT_TOKEN=$(grep '^  agent' bootstrap.out | grep -oE 'pwk_[A-Za-z0-9._-]+')" >> "$GITHUB_ENV"
          echo "AUDIT_TOKEN=$(grep '^  auditor' bootstrap.out | grep -oE 'pwk_[A-Za-z0-9._-]+')" >> "$GITHUB_ENV"
          grep -q 'pwk_' bootstrap.out || { echo "::error::no token found in bootstrap output"; cat bootstrap.out; exit 1; }

      - name: Run a witness-only node beside it, and give it a customer
        run: |
          # The same image, the way docker-compose.yml runs its witness: a
          # separate process with its own database and key, answering nothing
          # but co-signing, its key and health checks.
          docker run -d --name witness -p 8788:8787 -e PROOFWIRE_WITNESS_ONLY=1 proofwire-hub serve
          for i in $(seq 1 15); do
            status="$(docker inspect --format='{{.State.Health.Status}}' witness)"
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { echo "witness went unhealthy"; docker logs witness; exit 1; }
            sleep 2
          done
          [ "$status" = healthy ] || { echo "witness never became healthy"; docker logs witness; exit 1; }
          # witness-key prints to stderr, like bootstrap.
          docker exec witness node packages/server/src/bin.js witness-key ci-customer > witness-key.out 2>&1
          echo "WITNESS_TOKEN=$(grep '^  token' witness-key.out | grep -oE 'pwk_[A-Za-z0-9._-]+')" >> "$GITHUB_ENV"
          echo "WITNESS_URL=http://localhost:8788" >> "$GITHUB_ENV"
          grep -q 'pwk_' witness-key.out || { echo "::error::no token in witness-key output"; cat witness-key.out; exit 1; }

      - name: Drive it like a client would
        run: node scripts/docker-smoke.mjs

      - name: Read-only rootfs and non-root user, as docker-compose.yml runs it
        run: |
          docker run --rm --read-only --user 100:101 --tmpfs /tmp --entrypoint node proofwire-hub -e "
            const fs = require('fs');
            try { fs.writeFileSync('/app/should-fail', 'x'); process.exit(1); }
            catch (e) { if (e.code !== 'EROFS' && e.code !== 'EACCES') throw e; }
            console.log('read-only root enforced');
          "

      - name: Logs, on failure
        if: failure()
        run: |
          docker logs hub || true
          docker logs witness || true

  deploy-kit:
    # deploy/ run exactly as docs/DEPLOY.md tells an operator to run it, with
    # a self-signed certificate in place of a real domain. Then a customer's
    # path through real TLS: key issued on the host, `pw remote add`, a
    # co-signed checkpoint, and an auditor verifying it with the key that
    # `identity` printed on the host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund

      - name: First run creates .env and stops
        working-directory: deploy
        run: |
          if ./setup.sh; then echo "::error::setup.sh ran with no configuration"; exit 1; fi
          test -f .env
          [ "$(stat -c %a .env)" = 600 ] || { echo "::error::.env is not 600"; exit 1; }

      - name: Configure and bring it up
        working-directory: deploy
        run: |
          sed -i 's/^PROOFWIRE_DOMAIN=.*/PROOFWIRE_DOMAIN=localhost/; s/^PROOFWIRE_TLS=.*/PROOFWIRE_TLS=internal/' .env
          ./setup.sh | tee setup.out
          grep -q 'witness-record.mjs add --operator Proofwire' setup.out

      - name: Only Caddy faces the network
        run: |
          # HTTP is redirected to HTTPS.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost/health)"
          [ "$code" = 308 ] || { echo "::error::http gave $code, not a redirect"; exit 1; }
          # HTTPS reaches the witness, with the edge headers set.
          curl -fsSk https://localhost/.well-known/proofwire | grep -q '"proofwire-witness"'
          curl -sSk -D headers.txt -o /dev/null https://localhost/health
          grep -qi '^strict-transport-security:' headers.txt || { echo "::error::no HSTS"; cat headers.txt; exit 1; }
          if grep -qi '^server:' headers.txt; then echo "::error::Server header leaked"; cat headers.txt; exit 1; fi
          # The node's own port is not published.
          if curl -s --max-time 3 http://localhost:8787/health; then echo "::error::node port is reachable"; exit 1; fi
          # Witness-only: no console, no ingest.
          [ "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/login)" = 404 ]
          [ "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/v1/logs)" = 404 ]

      - name: A customer co-signs through TLS, and an auditor verifies it
        run: |
          cd deploy
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          docker compose exec -T node node packages/server/src/bin.js identity --json > "$RUNNER_TEMP/identity.json"
          docker compose exec -T node node packages/server/src/bin.js witness-key "CI Customer" > "$RUNNER_TEMP/key.out" 2>&1
          token="$(grep -oE 'pwk_[A-Za-z0-9._-]+' "$RUNNER_TEMP/key.out" | head -1)"
          [ -n "$token" ] || { cat "$RUNNER_TEMP/key.out"; exit 1; }

          export NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/caddy-root.crt"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          pw="node $GITHUB_WORKSPACE/packages/cli/src/bin.js"
          work="$RUNNER_TEMP/agent"; mkdir -p "$work"; cd "$work"
          $pw init
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"query","arguments":{"sql":"SELECT 1"}}}' |
            $pw proxy --no-remote -- node "$GITHUB_WORKSPACE/examples/fake-mcp-server.js" > /dev/null
          $pw remote add --name witness --url https://localhost --token "$token" | tee add.out
          grep -q 'A witness key' add.out
          $pw cosign --remote witness
          $pw export evidence.json
          pin="$(node -e "const j=require(process.argv[1]); process.stdout.write(j.witness.kid+'='+j.witness.publicKey)" "$RUNNER_TEMP/identity.json")"
          $pw check evidence.json --witnesses 1 --witness-key "$pin"

      - name: Backups land on their volume, and keys survive a restart
        working-directory: deploy
        run: |
          docker compose exec -T node node packages/server/src/bin.js backup /backups/ci.db
          docker compose exec -T node node packages/server/src/bin.js verify-backup /backups/ci.db
          before="$(docker compose exec -T node node packages/server/src/bin.js identity --json)"
          docker compose restart
          ./setup.sh > /dev/null
          after="$(docker compose exec -T node node packages/server/src/bin.js identity --json)"
          [ "$before" = "$after" ] || { echo "::error::the node's keys changed across a restart"; exit 1; }

      - name: Logs, on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 200 || true
