name: Pages

# The site is static files in site/. It is deployed by Actions rather than from
# a branch, so there is no gh-pages branch to drift out of sync, and what is
# live is always a commit on main that passed the site's own tests — including
# the differential test that holds the browser verifier to the core one.
on:
  push:
    branches: [main]
    # witnesses/keys.json is published on the site too, so a change to the
    # record must redeploy it rather than wait for the next site edit.
    paths: ['site/**', 'witnesses/keys.json', '.github/workflows/pages.yml']
  # release.json is written at deploy time, so publishing to npm should refresh
  # it: the install line appears by itself once the packages exist.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A failed release must not redeploy on its way past.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The verifier test imports @vouchwell/core through the workspace link.
      - run: npm install --no-audit --no-fund

      - name: Test the site
        run: node --no-warnings=ExperimentalWarning --test 'site/test/*.test.js'

      - name: Record whether the packages are on npm
        # This is what makes the install line appear. The CLI's name is
        # unscoped, so if someone else registered it first the registry would
        # happily return their version — and this page would send visitors to
        # their code. A version only counts if the package points back here.
        run: |
          repo="$(npm view vouchwell repository.url 2>/dev/null || true)"
          ver="$(npm view vouchwell version 2>/dev/null || true)"
          if [[ "$repo" == *"github.com/${GITHUB_REPOSITORY}"* && "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            printf '{ "npm": "%s" }\n' "$ver" > site/release.json
          else
            printf '{ "npm": null }\n' > site/release.json
            if [ -n "$ver" ]; then
              echo "::warning::'vouchwell' is on npm (version '$ver', repository '$repo') but that is not a release of this repository. Not advertising it."
            fi
          fi
          cat site/release.json

      - name: Stage the published files
        # The tests are for CI; there is no reason to serve them.
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -rf _site/test
          # The published witness key record, served from this origin so the
          # page can show it under its own Content-Security-Policy. One source
          # of truth: it is copied, never kept as a second file in site/.
          cp witnesses/keys.json _site/witness-keys.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
