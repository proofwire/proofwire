[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deedwrit"
version = "0.5.0"
description = "Tamper-evident receipts for AI agent actions. Python SDK, wire-compatible with the deedwrit CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "IdeaboticsAI" }]
keywords = ["ai-agents", "audit", "transparency-log", "merkle", "ed25519", "eu-ai-act"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Logging",
]
# One dependency, for Ed25519: the standard library has none, and signature
# code is the last thing a security product should write itself.
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# The framework adapters import their framework only when used; these extras
# install it alongside. Both frameworks need Python 3.10+.
langchain = ["langchain-core>=0.3"]
openai-agents = ["openai-agents>=0.2"]
test = [
  "pytest>=7",
  # So CI runs the adapters against the real frameworks where they install.
  "langchain-core>=0.3; python_version >= '3.10'",
  "openai-agents>=0.2; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/deedwrit/deedwrit"
Source = "https://github.com/deedwrit/deedwrit/tree/main/sdk/python"
Issues = "https://github.com/deedwrit/deedwrit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deedwrit = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
