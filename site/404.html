<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found — Vouchwell</title>
<meta name="color-scheme" content="light dark">
<style>
  /* Self-contained on purpose: a 404 is served at whatever path was mistyped,
     so relative links to fonts or scripts would resolve to the wrong place. */
  :root { --ground:#e9ebe5; --ink:#12170f; --ink-2:#454d40; --verify:#0b6e4f; --rule:#c9cec1; }
  @media (prefers-color-scheme: dark) { :root { --ground:#0f1310; --ink:#dfe5dc; --ink-2:#a3ad9f; --verify:#47a882; --rule:#2a322b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ground); color:var(--ink); font:17px/1.6 Georgia, "Times New Roman", serif; padding:24px; }
  main { max-width:34rem; }
  .mark { font:700 .98rem ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; letter-spacing:-.02em; }
  .mark em { font-style:normal; color:var(--verify); }
  h1 { font:800 2.4rem/1.05 system-ui, "Segoe UI", sans-serif; letter-spacing:-.03em; margin:22px 0 12px; }
  p { color:var(--ink-2); margin:0 0 14px; }
  a { color:var(--verify); }
  code { font:.86em ui-monospace, Menlo, Consolas, monospace; border:1px solid var(--rule); padding:1px 5px; border-radius:2px; }
</style>
</head>
<body>
<main>
  <span class="mark">vouch<em>well</em></span>
  <h1>Nothing here.</h1>
  <p>There is no page at this address. If you followed a link to a bundle or a document, it may have moved — the source of truth is the repository.</p>
  <p><a id="home" href="/">Back to the site</a> · <a href="https://github.com/vouchwell/vouchwell">The repository</a></p>
</main>
<script>
  // Project pages live under /<repo>/, user and custom-domain sites at the root.
  (function () {
    var onProject = /\.github\.io$/.test(location.hostname) && location.pathname.indexOf('/vouchwell/') === 0;
    document.getElementById('home').href = onProject ? '/vouchwell/' : '/';
  })();
</script>
</body>
</html>
