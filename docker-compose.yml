services:
  hub:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - deedwrit-data:/data
    environment:
      # Terminate TLS in front of this and set DEEDWRIT_TRUST_PROXY=1 there.
      # Without a proxy, leave it off: X-Forwarded-For is a header any client
      # can set, and trusting it would let anyone evade the rate limiter.
      DEEDWRIT_TRUST_PROXY: "0"
      DEEDWRIT_CHECKPOINT_EVERY: "500"
      DEEDWRIT_SELFCHECK_MINUTES: "60"
    restart: unless-stopped
    # The hub writes to /data and nowhere else.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # An independent witness. Run this somewhere the hub's operator does not
  # control — a different account, a different provider, ideally a different
  # company. A witness on the same host as the log it witnesses proves nothing
  # about that log that the log could not have claimed itself.
  #
  # Witness-only: it answers co-signing, its key and health checks, and 404s
  # everything else — no console, no log ingest, no key management over HTTP.
  # Give each customer a key from the host:
  #   docker compose exec witness node packages/server/src/bin.js witness-key <customer>
  witness:
    build: .
    ports:
      - "8788:8787"
    volumes:
      - deedwrit-witness:/data
    environment:
      DEEDWRIT_WITNESS_ONLY: "1"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  deedwrit-data:
  deedwrit-witness:
